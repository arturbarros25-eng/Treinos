['ti-list-check','Registrando as séries','<p>Cada linha é uma série. À esquerda ficam o número da série e a RPE alvo (por exemplo, @8,5). A coluna <b>Anterior</b> mostra a carga e as reps que você fez da última vez.</p><p>Digite a carga em kg e as reps, depois toque no botão de check. A linha fica roxa e o check fica vermelho.</p><p>Atalho: se deixar a carga vazia, o check usa a carga da última vez. Se a meta de reps for um número fixo (como 10), ele também preenche as reps. Para AMRAP ou faixas como 7-9, digite as reps que você fez.</p><p>Errou? Toque no check de novo para desmarcar e corrija.</p>'],

['ti-bolt','Técnicas','<p>As etiquetas roxas mostram a técnica do exercício (SLOW, Rest pause, USD), e a explicação aparece logo abaixo do nome. A lista completa fica em Ajustes.</p>'],

$('v').addEventListener('input',e=>{const t=e.target;if(t.dataset.x!==undefined&&ed){edIn(t)}else if(t.dataset.f){S.a.ex[+t.dataset.e].sets[+t.dataset.s][t.dataset.f]=t.value;save()}else if(t.id==='q'){q=t.value;$('pl').innerHTML=pList()}else if(t.id==='rn')ed.n=t.value;else if(t.id==='an'){S.a.n=t.value;save()}else if(t.id==='rs'){S.rest=Math.max(10,+t.value||90);save()}});
$('v').addEventListener('change',e=>{const t=e.target;if(t.id==='pex'){pex=t.value;R()}else if(t.dataset.x!==undefined&&ed)edIn(t)});
const TOP=['start','startr','again','editr','newr','pickr','picka','pickx','cancr','saver','finish','gohelp'];
$('v').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,id=b.dataset.id,pa=arm,wp=pick;arm=null;msg='';msgE=-1;
if(a==='exp'){const j=JSON.stringify(S);$('bk').value=j;$('bm').textContent='O backup está no campo acima. Copie e guarde no app Notas ou Arquivos.';try{navigator.clipboard.writeText(j).then(()=>{$('bm').textContent='Backup copiado. Cole e guarde no app Notas ou Arquivos.'}).catch(()=>{})}catch(x){}return}
if(a==='imp'){try{const d=JSON.parse($('bk').value);if(!Array.isArray(d.w))throw 0;S=Object.assign({w:[],r:[],p:[],c:[],rest:90},d,{a:null,seed:1});save();R();$('bm').textContent='Backup importado.'}catch(x){$('bm').innerHTML='<span style="color:var(--text-danger)">Esse texto não é um backup válido. Confira se copiou tudo.</span>'}return}
switch(a){
case 'gohelp':view='help';hOpen=0;break;
case 'hlp':hOpen=hOpen===i?-1:i;break;
case 'start':S.a={n:'Treino livre',t:Date.now(),ex:[]};break;
case 'startr':startR(S.r[i]);break;
case 'ptog':openP=openP===id?null:id;break;
case 'pren':pren=id;break;
case 'pnsave':{const p=S.p.find(x=>x.id===id),v=$('pn').value.trim();if(v)p.n=v;pren=null;break}
case 'pdel':if(pa==='p'+id){S.p=S.p.filter(p=>p.id!==id);S.r=S.r.filter(r=>r.p!==id)}else arm='p'+id;break;
case 'newp':{const nid='p'+Date.now();S.p.push({id:nid,n:'Novo programa'});openP=nid;pren=nid;break}
case 'newr':ed={pid:id,i:-1,n:'',ex:[]};break;
case 'editr':{const r=S.r[i];ed={pid:r.p,i,n:r.n,ex:JSON.parse(JSON.stringify(r.ex))};break}
case 'delr':if(pa==='dr'){S.r.splice(ed.i,1);ed=null}else arm='dr';break;
case 'mvup':{const t=ed.ex[i];ed.ex[i]=ed.ex[i-1];ed.ex[i-1]=t;break}
case 'rdel':ed.ex.splice(i,1);break;
case 'es+':{const st=ed.ex[i].sets;st.push(Object.assign({},st[st.length-1]||{r:'',rpe:''}));break}
case 'es-':ed.ex[i].sets.pop();break;
case 'pickr':pick='r';break;
case 'picka':pick='a';break;
case 'pickx':pick=null;break;
case 'pg':qg=i;break;
case 'pk':if(pick==='a'){const p=prev(id);S.a.ex.push({id,rest:S.rest||90,tec:'',ss:false,nt:'',sets:mk(p?p.length:3)})}else ed.ex.push({id,rest:S.rest||90,tec:'',ss:false,nt:'',sets:[{r:'',rpe:''},{r:'',rpe:''},{r:'',rpe:''}]});pick=null;q='';qg=-1;break;
case 'cancr':ed=null;break;
case 'saver':{const n=$('rn').value.trim();if(!n){msg='Dê um nome para a rotina.';break}if(!ed.ex.length){msg='Adicione pelo menos um exercício.';break}const r={id:ed.i>=0?S.r[ed.i].id:'r'+Date.now(),p:ed.pid,n,ex:ed.ex};if(ed.i<0)S.r.push(r);else S.r[ed.i]=r;openP=ed.pid;ed=null;break}
case 'done':{const ei=+b.dataset.e,E=S.a.ex[ei],si=+b.dataset.s,s=E.sets[si];if(s.d){s.d=false;break}const p=(prev(E.id)||[])[si];s.kg=String(s.kg).replace(',','.').trim();s.r=String(s.r).trim();if(s.kg===''&&p)s.kg=String(p.kg);if(s.r===''){if(/^\d+$/.test(s.tr||''))s.r=s.tr;else if(!s.tr&&p)s.r=String(p.r)}if(!(+s.r>0)){msgE=ei;msg='Preencha as repetições da série '+(si+1)+'.';break}if(s.kg===''||isNaN(+s.kg))s.kg='0';s.d=true;const sec=E.ss&&S.a.ex[ei+1]?0:(E.rest||S.rest||90);rest=sec>0?Date.now()+sec*1000:null;break}
case 'r-':rest=Math.max(Date.now()+1000,rest-15000);break;
case 'r+':rest+=15000;break;
case 'rskip':rest=null;break;
case 'exdel':if(pa==='e'+i)S.a.ex.splice(i,1);else arm='e'+i;break;
case 'addset':{const st=S.a.ex[i].sets,l=st[st.length-1]||{};st.push({kg:'',r:'',d:false,tr:l.tr||'',rpe:l.rpe||''});break}
case 'rmset':S.a.ex[i].sets.pop();break;
case 'finish':{const x2=S.a.ex.map(e=>({id:e.id,sets:e.sets.filter(s=>s.d).map(s=>({kg:+String(s.kg).replace(',','.')||0,r:+s.r||0}))})).filter(e=>e.sets.length);if(!x2.length){msg='Conclua pelo menos uma série antes de finalizar.';break}const w={id:Date.now(),n:S.a.n.trim()||'Treino',t:S.a.t,e:Date.now(),rid:S.a.rid,pid:S.a.pid,ex:x2};S.w.unshift(w);S.a=null;rest=null;view='hist';open=w.id;break}
case 'discard':if(pa==='disc'){S.a=null;rest=null}else arm='disc';break;
case 'tog':open=open===+id?null:+id;break;
case 'again':{const w=S.w.find(x=>x.id===+id),r=S.r.find(x=>x.id===w.rid);if(r)startR(r);else S.a={n:w.n,t:Date.now(),ex:w.ex.map(e=>({id:e.id,rest:S.rest||90,tec:'',ss:false,nt:'',sets:mk(e.sets.length)}))};ed=null;view='treino';break}
case 'delw':if(pa==='w'+id)S.w=S.w.filter(x=>x.id!==+id);else arm='w'+id;break;
case 'pm':pm=b.dataset.m;break;
case 'reseed':if(pa==='rs')seed();else arm='rs';break;
case 'addc':{const n=$('cn').value.trim();if(!n){msg='Digite o nome do exercício.';break}S.c.push({id:'c'+Date.now(),n,g:+$('cg').value});break}
case 'delc':if(pa==='c'+i)S.c.splice(i,1);else arm='c'+i;break}
save();R();if(TOP.includes(a))window.scrollTo(0,0);else if(a==='pk'&&wp==='a')window.scrollTo(0,document.body.scrollHeight)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
load();openP=(S.w[0]&&S.w[0].pid)||(S.p[0]&&S.p[0].id);R();setInterval(tick,1000);
